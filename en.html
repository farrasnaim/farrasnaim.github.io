<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- The English copy moved back to the site root when it became the
         default page again. This stub keeps the /en.html URL working for
         anything already linking to it. GitHub Pages can't issue a 301, so a
         zero-second meta refresh plus a canonical is as close as we get;
         noindex keeps it out of results so the root URL is the one that
         ranks. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'self'; form-action 'none'">
    <meta http-equiv="refresh" content="0; url=./">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://farrasnaim.github.io/">
    <title>Farras Naim</title>
</head>
<body>
    <p>This page now lives at <a href="./">farrasnaim.github.io</a>.</p>
</body>
</html>
